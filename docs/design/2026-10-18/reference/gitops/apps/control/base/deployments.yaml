apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-dispatcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: harness-dispatcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harness-dispatcher
    spec:
      serviceAccountName: harness-dispatcher
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: dispatcher
          image: harness-runtime:design
          args: [dispatcher]
          env:
            - name: WORKER_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: harness-worker-release
                  key: image
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: harness-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harness-gateway
    spec:
      serviceAccountName: harness-gateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: gateway
          image: harness-gateway:design
          args: [gateway]
          env:
            - name: GATEWAY_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: harness-identity-policy
                  key: gateway_audience
            - name: ALLOWED_WORKER_SUBJECTS_JSON
              valueFrom:
                configMapKeyRef:
                  name: harness-identity-policy
                  key: allowed_worker_subjects
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: '1'
              memory: 2Gi
          volumeMounts:
            - name: serving-tls
              mountPath: /var/run/harness/tls
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: serving-tls
          secret:
            secretName: harness-gateway-tls
            defaultMode: 288
